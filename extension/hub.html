<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pagewright — Community setups</title>
    <link rel="stylesheet" href="popup.css" />
    <link rel="stylesheet" href="hub.css" />
  </head>
  <body class="hub">
    <header class="top hubtop">
      <div class="brand">
        <img src="icons/icon48.png" alt="" width="28" height="28" />
        <span class="name">Pagewright <em>Community</em></span>
      </div>
      <nav class="tabs">
        <button data-tab="popular" class="tab active">Popular</button>
        <button data-tab="browse" class="tab">Browse</button>
        <button data-tab="mine" class="tab">My setups</button>
      </nav>
      <div class="account">
        <span id="whoami" class="hint" hidden></span>
        <button id="signInBtn" class="btn small">Sign in</button>
        <button id="signOutBtn" class="btn small ghost" hidden>Sign out</button>
      </div>
    </header>

    <main class="hubmain">
      <section id="browse">
        <h2 id="browseTitle" class="sectiontitle"></h2>
        <div class="filters">
          <input
            id="siteFilter"
            aria-label="Search websites"
            list="siteList"
            placeholder="Website, e.g. reddit.com"
            spellcheck="false"
          />
          <datalist id="siteList"></datalist>
          <input
            id="search"
            aria-label="Search setups"
            placeholder="Search titles, descriptions, makers…"
          />
          <label class="ctl" id="sortWrap"
            >Sort
            <select id="sort">
              <option value="popular">Most liked</option>
              <option value="newest">Newest</option>
              <option value="tried">Most tried</option>
              <option value="title">A–Z</option>
            </select>
          </label>
          <div class="seg" role="group" aria-label="View">
            <button
              data-view="grid"
              class="active"
              title="Grid"
              aria-label="Grid view"
              aria-pressed="true"
            >
              ▦
            </button>
            <button data-view="list" title="List" aria-label="List view" aria-pressed="false">
              ☰
            </button>
            <button
              data-view="compact"
              title="Compact"
              aria-label="Compact view"
              aria-pressed="false"
            >
              ≡
            </button>
          </div>
          <label class="ctl"><input type="checkbox" id="likedOnly" /> Only my likes</label>
          <div class="quick">
            <button class="chip" data-site="">All</button>
            <button class="chip" data-site="reddit.com">Reddit</button>
            <button class="chip" data-site="linkedin.com">LinkedIn</button>
            <button class="chip" data-site="youtube.com">YouTube</button>
            <button class="chip" data-site="x.com">X</button>
          </div>
        </div>
        <p id="browseMsg" class="hint" role="status" aria-live="polite"></p>
        <div id="grid" class="grid"></div>
      </section>

      <section id="mine" hidden>
        <h2 class="sectiontitle">My setups</h2>
        <div id="mineGrid" class="grid"></div>
      </section>
    </main>

    <dialog id="shareDlg" class="dlg">
      <form id="shareForm" method="dialog">
        <h2>Share this setup</h2>
        <p id="shareWhat" class="hint"></p>
        <label class="label" for="shTitle">Title</label>
        <input
          id="shTitle"
          required
          minlength="2"
          maxlength="80"
          placeholder="e.g. Clean Reddit, dark & no ads"
        />
        <label class="label" for="shDesc">What does it do? (optional)</label>
        <textarea id="shDesc" rows="3" maxlength="500"></textarea>
        <p id="shareAs" class="hint"></p>
        <p id="shareErr" class="error" hidden></p>
        <div class="row">
          <button type="submit" id="shareSubmit" class="btn primary">Share publicly</button>
          <button type="button" id="shareCancel" class="btn ghost">Cancel</button>
        </div>
      </form>
    </dialog>

    <dialog id="authDlg" class="dlg">
      <form id="authForm" method="dialog">
        <h2 id="authTitle">Sign in</h2>
        <p class="hint">
          Sign in to save encrypted API keys and share setups. Trying saved community setups works
          without an account.
        </p>
        <div id="usernameWrap" hidden>
          <label class="label" for="auUser">Username (shown on what you share)</label>
          <input
            id="auUser"
            maxlength="20"
            pattern="[a-z0-9_]{3,20}"
            placeholder="e.g. mila_k"
            autocomplete="username"
          />
        </div>
        <label class="label" for="auEmail">Email</label>
        <input id="auEmail" type="email" required autocomplete="email" />
        <label class="label" for="auPass">Password</label>
        <input id="auPass" type="password" required minlength="8" autocomplete="current-password" />
        <p id="authErr" class="error" hidden></p>
        <p id="authOk" class="hint" hidden></p>
        <div class="row">
          <button type="submit" id="authSubmit" class="btn primary">Sign in</button>
          <button type="button" id="authCancel" class="btn ghost">Cancel</button>
        </div>
        <p class="hint"><a href="#" id="authSwitch">New here? Create an account</a></p>
      </form>
    </dialog>

    <script src="config.js"></script>
    <script src="hub.js"></script>
  </body>
</html>
